name: Installer ISO

# Builds the Magic installer ISO and tests it end to end in a VM:
# boot the ISO, install Magic (encrypted, TPM unlock), boot the result,
# wait for first-boot setup. Called by the release workflow; can also be run by hand.
on:
  workflow_call:
    inputs:
      image_ref:
        description: Magic image the installer test should install
        type: string
        default: ghcr.io/alex-ha-192/magic-os:latest
      keep_iso:
        description: Upload the ISO as a workflow artifact (for the release)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_ref:
        description: Magic image the installer test should install
        type: string
        default: ghcr.io/alex-ha-192/magic-os:latest
      keep_iso:
        description: Upload the ISO as a workflow artifact
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/installer.yml'

permissions:
  contents: read
  packages: read

jobs:
  iso:
    name: Build and test the installer ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Build the installer image
        run: |
          sudo podman build --cap-add sys_admin --security-opt label=disable --squash \
            -t localhost/magic-installer:latest installer/

      - name: Output folder
        run: mkdir -p output

      - name: Make the ISO
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main
        with:
          image-ref: localhost/magic-installer:latest
          iso-dest: ${{ github.workspace }}/output/MagicOS.iso

      - name: ISO size
        env:
          ISO_DEST: ${{ steps.iso.outputs.iso-dest }}
        run: |
          # Titanoboa resolves iso-dest relative to its own folder; bring it here.
          [[ -f output/MagicOS.iso ]] || mv "$ISO_DEST" output/MagicOS.iso
          ls -la output/
          sudo podman rmi -f localhost/magic-installer:latest || true
          df -h /

      - name: Prepare the VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools mtools dosfstools python3-pil

      - name: End-to-end test in a VM
        env:
          IMAGE_REF: ${{ inputs.image_ref || 'ghcr.io/alex-ha-192/magic-os:latest' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: tests/e2e-vm.sh output/MagicOS.iso "$IMAGE_REF" test-output

      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-test
          path: test-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the ISO
        if: inputs.keep_iso
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magic-iso
          path: output/MagicOS.iso
          compression-level: 0
          retention-days: 7
