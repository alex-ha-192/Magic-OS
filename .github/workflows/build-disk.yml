---
name: Build disk images

on:
  # Called by build.yml after every release: builds the installer ISO and attaches
  # it to the release as MagicOS.iso.
  workflow_call:
    inputs:
      platform:
        type: string
        default: amd64
      release_tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the ISO to this release (e.g. 2026-11-26). Leave empty for a plain test build."
        required: false
        default: ""
        type: string
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: ${{ inputs.release_tag || 'latest' }}
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  # Must differ from the calling workflow's group, or the two would block each other.
  group: disk-${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build disk images
    runs-on: ${{ (inputs.platform || 'amd64') == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # Releases get only the installer ISO. Hand-run builds also make a VM disk.
        disk-type: ${{ fromJSON(inputs.release_tag != '' && '["anaconda-iso"]' || '["qcow2","anaconda-iso"]') }}
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image is private while the repository is. The builder pulls it as root.
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | sudo podman login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request' && inputs.release_tag == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}

      # Attach the ISO to the release under a fixed name, so this link always works:
      #   https://github.com/<owner>/<repo>/releases/latest/download/MagicOS.iso
      # GitHub allows 2 GiB per release file. A bigger ISO is split into parts
      # (MagicOS.iso.001, .002, ...) and the release notes say how to join them.
      - name: Attach ISO to the release
        if: inputs.release_tag != '' && matrix.disk-type == 'anaconda-iso'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          OUT: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          iso=$(find "$OUT" -name '*.iso' | head -1)
          [[ -n "$iso" ]] || { echo "no ISO found in $OUT"; exit 1; }
          mkdir -p /tmp/release && cd /tmp/release
          mv "$iso" MagicOS.iso
          sha256sum MagicOS.iso > MagicOS.iso.sha256
          size=$(stat -c %s MagicOS.iso)
          echo "ISO size: $size bytes"
          if [[ "$size" -lt 2147483648 ]]; then
            gh release upload "$TAG" MagicOS.iso MagicOS.iso.sha256 --clobber -R "$GITHUB_REPOSITORY"
            note="Installer: [MagicOS.iso](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MagicOS.iso)"
          else
            split -b 1900M -d -a 3 --numeric-suffixes=1 MagicOS.iso MagicOS.iso.
            rm MagicOS.iso
            gh release upload "$TAG" MagicOS.iso.[0-9]* MagicOS.iso.sha256 --clobber -R "$GITHUB_REPOSITORY"
            note="Installer is split in parts (GitHub's 2 GiB limit). Download all MagicOS.iso.NNN files, then run: cat MagicOS.iso.* > MagicOS.iso (the .sha256 file checks the joined ISO)."
          fi
          body=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body)
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "${body}"$'\n\n'"${note}"
