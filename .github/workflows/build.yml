---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Release catch-up check, every 3 hours. The "gate" job publishes only if
    # this week's release (Saturday 12:00 London) has not gone out yet, so a
    # late or dropped run just means the next check does it. Cheap when idle.
    - cron: '23 */3 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build to GHCR (an out-of-schedule release)"
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  # Only pull requests cancel each other. A push must never cancel Saturday's release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether this run builds, whether it publishes, and the version.
  #   scheduled check  -> publish if this week's release (Saturday 12:00 London)
  #                       has not gone out yet; otherwise do nothing
  #   manual run       -> publish only if you tick "publish"
  #   push / PR        -> build and test only, never publish
  gate:
    name: Decide whether to build and publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    outputs:
      proceed: ${{ steps.g.outputs.proceed }}
      publish: ${{ steps.g.outputs.publish }}
      version: ${{ steps.g.outputs.version }}
      push_tag: ${{ steps.g.outputs.push_tag }}
      test_ref: ${{ steps.g.outputs.test_ref }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          # GitHub switches off scheduled workflows in quiet repos; switch it back on.
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/enable" || true

          # Version = today's date; append -2, -3... for more releases the same day.
          today=$(date -u +%Y-%m-%d)
          tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName')
          n=$(grep -cE "^${today}(-[0-9]+)?$" <<<"$tags" || true)
          if [[ "$n" -eq 0 ]]; then version="$today"; else version="${today}-$((n+1))"; fi

          # Newest Saturday 12:00 London that has already happened.
          now=$(date +%s); due=""
          for d in 0 1 2 3 4 5 6 7; do
            ts=$(TZ=Europe/London date -d "12:00 ${d} days ago" +%s)
            wd=$(TZ=Europe/London date -d "12:00 ${d} days ago" +%u)
            if [[ "$wd" == "6" && "$ts" -le "$now" ]]; then due=$ts; break; fi
          done
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json createdAt -q '.[0].createdAt // empty')
          last_ts=0; [[ -n "$last" ]] && last_ts=$(date -d "$last" +%s)
          echo "now=$now due=$due last_release=$last_ts version=$version"

          proceed=true; publish=false
          case "$EVENT" in
            schedule)
              if [[ "$ON_DEFAULT_BRANCH" == "true" && "$last_ts" -lt "$due" ]]; then publish=true; else proceed=false; fi ;;
            workflow_dispatch)
              [[ "$PUBLISH_INPUT" == "true" && "$ON_DEFAULT_BRANCH" == "true" ]] && publish=true ;;
          esac
          # Which tag to push this build under, so the installer test can install it.
          # Releases: the version. Other runs on main: a throwaway ci-<run> tag
          # (pruned at the next release). Pull requests: nothing; test "latest".
          push_tag=""
          if [[ "$publish" == "true" ]]; then push_tag="$version"
          elif [[ "$proceed" == "true" && "$EVENT" != "pull_request" && "$ON_DEFAULT_BRANCH" == "true" ]]; then push_tag="ci-${GITHUB_RUN_ID}"; fi
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/magic-os"
          test_ref="${repo}:${push_tag:-latest}"
          echo "proceed=$proceed publish=$publish version=$version push_tag=$push_tag test_ref=$test_ref"
          { echo "proceed=$proceed"; echo "publish=$publish"; echo "version=$version"; echo "push_tag=$push_tag"; echo "test_ref=$test_ref"; } >> "$GITHUB_OUTPUT"

  # Fast checks. If any fails, nothing is built or published.
  checks:
    name: Check files
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Shell scripts
        run: |
          shopt -s nullglob
          for f in build_files/build.sh build_files/steps/*.sh system_files/usr/bin/magic-*; do bash -n "$f"; done
          shellcheck -S warning build_files/build.sh build_files/steps/*.sh system_files/usr/bin/magic-*
      - name: Plasma layout script and metadata
        run: |
          node --check system_files/usr/share/plasma/look-and-feel/org.magicos.desktop/contents/layouts/org.kde.plasma.desktop-layout.js
          python3 -c "import json,sys; json.load(open('system_files/usr/share/plasma/look-and-feel/org.magicos.desktop/metadata.json'))"
      - name: Installer code
        run: |
          python3 -m py_compile installer/files/usr/libexec/magic-installer/*.py tests/qmp.py system_files/usr/share/magic-settings/magic_settings.py tools/gen-theme.py
          node --check installer/files/usr/share/magic-installer/ui/app.js
          for f in installer/build.sh tests/e2e-vm.sh system_files/usr/libexec/magic-os/* build_files/steps/*.sh; do head -1 "$f" | grep -q python || bash -n "$f"; done
          python3 -c "import json; json.load(open('installer/files/usr/lib64/firefox/distribution/policies.json'))"
      - name: Every app the installer offers exists on Flathub
        run: |
          ids=$(python3 -c "import ast,sys; t=open('installer/files/usr/libexec/magic-installer/server.py').read(); s=t.index('APPS = {'); e=t.index('}', s); print(' '.join(ast.literal_eval(t[s+7:e+1]).values()))")
          bad=0
          for id in $ids; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://flathub.org/api/v2/appstream/$id")
            echo "$id $code"; [[ "$code" == "200" ]] || bad=1
          done
          exit $bad
      - name: Upstream submodule is present
        run: test -f upstream/aurora/build_scripts/base/19-initramfs.sh

  build_push:
    name: Build and push image
    needs: [gate, checks]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    env:
      MAGIC_VERSION: ${{ needs.gate.outputs.version }}
      # Signing switches on by itself once a SIGNING_SECRET exists.
      HAS_KEY: ${{ secrets.SIGNING_SECRET != '' }}

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      # Last gate before anything is published: start the built image and check it.
      - name: Smoke test the image
        run: |
          podman run --rm "${IMAGE_NAME}:${DEFAULT_TAG}" bash -euxc '
            . /usr/lib/os-release
            [[ "$NAME" == "Magic OS" ]]
            [[ "$VERSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$ ]]
            grep -q "AutomaticUpdatePolicy=none" /etc/rpm-ostreed.conf
            test -x /usr/bin/magic-rollback
            test -x /usr/bin/magic-update-status
            test -f /usr/share/plasma/look-and-feel/org.magicos.desktop/metadata.json
            test -f /usr/share/color-schemes/MagicEmber.colors
            systemctl is-enabled magic-flatpak-update.timer
            systemctl is-enabled magic-firstboot.service
            systemctl is-enabled magic-apps.timer
            test -x /usr/libexec/magic-os/firstboot
            # theming and the Magic apps
            for a in Lime Ember Magenta Teal Blue Violet; do
              test -f /usr/share/color-schemes/Magic$a.colors
              test -f /usr/share/wallpapers/Magic$a/contents/images/3840x2160.jpg
            done
            grep -q "^ColorScheme=MagicLime" /etc/xdg/kdeglobals
            grep -q "^\[Colors:Window\]" /etc/xdg/kdeglobals
            grep -q "^LookAndFeelPackage=org.magicos.desktop" /etc/xdg/kdeglobals
            test -f /usr/share/plasma/look-and-feel/org.magicos.desktop/contents/layouts/org.kde.plasma.desktop-layout.js
            test -f /usr/share/plasma/look-and-feel/org.magicos.desktop/contents/splash/Splash.qml
            [[ "$(plymouth-set-default-theme)" == "magic" ]]
            lsinitrd /usr/lib/modules/*/initramfs.img | grep -q "plymouth/themes/magic/magic.script"
            QT_QPA_PLATFORM=offscreen MAGIC_SETTINGS_DEMO=1 timeout 120 /usr/bin/magic-settings --check
            test -f /usr/share/plasma/plasmoids/org.magicos.start/contents/ui/StartMenu.qml
            XDG_CURRENT_DESKTOP=KDE /usr/libexec/magic-os/start-helper data | jq -e ".apps | length > 5"
            /usr/libexec/magic-os/versions | jq -e ".running | test(\"^[0-9]{4}-\")"
            grep -q "Hidden=true" /etc/xdg/autostart/org.kde.plasma-welcome.desktop
            grep -q "^Name=Advanced Settings" /usr/share/applications/systemsettings.desktop
            grep -q "^Name=App Store" /usr/share/applications/org.kde.discover.desktop
            if rpm -q plasma-discover-rpm-ostree; then echo "Discover still has system updates"; exit 1; fi
            systemctl is-enabled magic-update.timer
            if systemctl is-enabled rpm-ostreed-automatic.timer; then echo "rpm-ostree automatic updates still on"; exit 1; fi
            ls /usr/lib/modules/*/initramfs.img
            # The initramfs must be able to set up the ostree root.
            lsinitrd /usr/lib/modules/*/initramfs.img | grep -q ostree-prepare-root
          '

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.gate.outputs.push_tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push under the version tag only. "latest" (what installed computers follow)
      # moves later, in the promote job, after the installer test passes.
      - name: Push To GHCR
        if: needs.gate.outputs.push_tag != ''
        id: push-image
        env:
          PUSH_TAG: ${{ needs.gate.outputs.push_tag }}
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${PUSH_TAG}"
          echo "digest=$(< /tmp/digestfile)" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: needs.gate.outputs.publish == 'true' && env.HAS_KEY == 'true'
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: needs.gate.outputs.publish == 'true' && env.HAS_KEY == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  # Build the installer ISO and test it end to end: install this new version in
  # a VM, boot it, check first-boot setup. Pushes and PRs test against "latest".
  installer:
    name: Installer
    needs: [gate, build_push]
    if: needs.gate.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/installer.yml
    with:
      image_ref: ${{ needs.gate.outputs.test_ref }}
      keep_iso: ${{ needs.gate.outputs.publish == 'true' }}

  # Only now does the new version reach people: move "latest", create the
  # release, attach MagicOS.iso, and prune old images.
  promote:
    name: Release
    needs: [gate, build_push, installer]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      MAGIC_VERSION: ${{ needs.gate.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/magic-os
      IMAGE_NAME: magic-os
      HAS_KEY: ${{ secrets.SIGNING_SECRET != '' }}
    steps:
      - name: Move "latest" to the new version
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy --all --preserve-digests "docker://${IMAGE}:${MAGIC_VERSION}" "docker://${IMAGE}:latest"

      # The release is the record of what shipped. The gate reads these to decide
      # whether this week's release is done, and to number same-day releases.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signed="unsigned"; [[ "${HAS_KEY}" == "true" ]] && signed="signed"
          notes="Image: ${IMAGE}:${MAGIC_VERSION} (${signed}). Built from ${GITHUB_SHA}. Installer tested in a VM before release."
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                 -f tag_name="${MAGIC_VERSION}" -f target_commitish="${GITHUB_SHA}" \
                 -f name="Magic OS ${MAGIC_VERSION}" -f body="${notes}" >/dev/null; then
              exit 0
            fi
            echo "Release attempt ${attempt} failed; response headers for diagnosis:"
            gh api -i -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="${MAGIC_VERSION}" \
              -f target_commitish="${GITHUB_SHA}" -f name="Magic OS ${MAGIC_VERSION}" -f body="${notes}" 2>&1 | head -25 || true
            sleep 20
          done
          exit 1

      - name: Download the tested ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: magic-iso
          path: iso

      # Fixed name, so this always works:
      #   https://github.com/<owner>/<repo>/releases/latest/download/MagicOS.iso
      # GitHub allows 2 GiB per release file; a bigger ISO is split into parts.
      - name: Attach MagicOS.iso to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd iso
          sha256sum MagicOS.iso > MagicOS.iso.sha256
          size=$(stat -c %s MagicOS.iso); echo "ISO size: $size bytes"
          if [[ "$size" -lt 2147483648 ]]; then
            gh release upload "$MAGIC_VERSION" MagicOS.iso MagicOS.iso.sha256 --clobber -R "$GITHUB_REPOSITORY"
            note="Installer: [MagicOS.iso](https://github.com/${GITHUB_REPOSITORY}/releases/download/${MAGIC_VERSION}/MagicOS.iso). Needs an internet connection (Wi-Fi or cable) to install."
          else
            split -b 1900M -d -a 3 --numeric-suffixes=1 MagicOS.iso MagicOS.iso.
            rm MagicOS.iso
            gh release upload "$MAGIC_VERSION" MagicOS.iso.[0-9]* MagicOS.iso.sha256 --clobber -R "$GITHUB_REPOSITORY"
            note="Installer is split in parts (GitHub's 2 GiB limit). Download all MagicOS.iso.NNN files, then run: cat MagicOS.iso.* > MagicOS.iso"
          fi
          body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${MAGIC_VERSION}" --jq .body)
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${MAGIC_VERSION}" --jq .id)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -f body="${body}"$'\n\n'"${note}" >/dev/null

      # Keep the newest release image and the three before it, so people can go
      # back. Anything older is deleted. A failure here never fails the release.
      - name: Prune old images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep_tags=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=4" --jq '.[].tag_name')
          keep_tags=$(printf '%s\nlatest\n' "$keep_tags")
          api="users/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE_NAME}/versions"
          versions=$(gh api --paginate "$api")
          keep_digests=$(jq -r --arg keep "$keep_tags" '
            ($keep | split("\n")) as $k
            | .[] | select((.metadata.container.tags // []) | any(. as $t | $k | index($t))) | .name' <<<"$versions")
          jq -c '.[] | select((.metadata.container.tags // []) | length > 0) | {id, name, tags: .metadata.container.tags}' <<<"$versions" | while read -r v; do
            id=$(jq -r .id <<<"$v"); name=$(jq -r .name <<<"$v")
            grep -qx "$name" <<<"$keep_digests" && continue
            sigfor=$(jq -r '.tags[] | select(test("^sha256-[0-9a-f]+\\.(sig|att)$")) | sub("^sha256-";"sha256:") | sub("\\.(sig|att)$";"")' <<<"$v" | head -1)
            if [[ -n "$sigfor" ]] && grep -qx "$sigfor" <<<"$keep_digests"; then continue; fi
            echo "Deleting $(jq -c .tags <<<"$v")"
            gh api -X DELETE "${api}/${id}" || true
          done
